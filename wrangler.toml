# Cloudflare Pages project config. With this file present, bindings below are the source of truth
# (dashboard binding edits are ignored). See docs/DEPLOY.md.
name = "eschmechel-dev"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Workers AI — the agent model (src/agent/core.ts MODEL)
[ai]
binding = "AI"

# KV — answer cache, per-IP hourly counters, daily neuron budget, homelab last-seen snapshot.
# Create once with:  npx wrangler kv namespace create AGENT_KV   and paste the id here.
[[kv_namespaces]]
binding = "AGENT_KV"
id = "REPLACE_WITH_AGENT_KV_ID"

[vars]
AGENT_HOURLY_LIMIT = "20"     # model answers per IP per hour (cache hits are free)
AGENT_DAILY_NEURONS = "9000"  # stays under the 10k/day free Workers AI allocation
HOMELAB_STATUS_URL = ""       # e.g. https://status.lab.eschmechel.dev/status (behind Cloudflare Access)
# Secrets (not here): npx wrangler pages secret put HOMELAB_ACCESS_CLIENT_ID / HOMELAB_ACCESS_CLIENT_SECRET
