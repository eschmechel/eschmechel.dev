# Cloudflare Worker (static assets + /api/* Worker) — deployed by Workers Builds on push to
# portfolio-v3, or `npx wrangler deploy`. See docs/DEPLOY.md.
# NOT `eschmechel-dev`: that Pages project serves the live v1 site until launch.
name = "eschmechel-v3"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"        # dist/404.html with a real 404 status
html_handling = "drop-trailing-slash"  # /projects, not /projects/ — matches canonical + sitemap
run_worker_first = ["/api/*"]          # everything else never touches the Worker

# Workers AI — the agent model (src/agent/core.ts MODEL)
[ai]
binding = "AI"
remote = true  # Workers AI always runs remotely (and is billed) — even under wrangler dev

# KV — answer cache, per-IP hourly counters, daily neuron budget, homelab last-seen snapshot.
# Created 2026-10-06 with: npx wrangler kv namespace create AGENT_KV
[[kv_namespaces]]
binding = "AGENT_KV"
id = "b2d01fb747ae4189919da0ed3246f940"

[vars]
AGENT_HOURLY_LIMIT = "20"     # model answers per IP per hour (cache hits are free)
AGENT_DAILY_NEURONS = "9000"  # stays under the 10k/day free Workers AI allocation
HOMELAB_STATUS_URL = ""       # e.g. https://status.lab.eschmechel.dev/status (behind Cloudflare Access)
# Secrets (not here): npx wrangler secret put HOMELAB_ACCESS_CLIENT_ID / HOMELAB_ACCESS_CLIENT_SECRET
